<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 140" width="540" height="140">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;600;700&amp;display=swap');
      .brand-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: 12px;
        fill: #121214;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 5.5px;
        fill: #705B3E;
      }
    </style>
  </defs>
  <!-- SENS Wave Mark (3 Fluid Waves) -->
  <g transform="translate(10, 10)">
    <!-- Wave 1 (Top) -->
    <path d="M 0 28 C 38 12, 82 44, 120 28 L 120 48 C 82 64, 38 32, 0 48 Z" fill="#121214" fill-opacity="0.8"/>
    <!-- Wave 2 (Middle) -->
    <path d="M 0 58 C 38 42, 82 74, 120 58 L 120 78 C 82 94, 38 62, 0 78 Z" fill="#121214" fill-opacity="0.9"/>
    <!-- Wave 3 (Bottom) -->
    <path d="M 0 88 C 38 72, 82 104, 120 88 L 120 108 C 82 124, 38 92, 0 108 Z" fill="#121214"/>
  </g>
  <!-- Typography -->
  <text x="156" y="80" class="brand-title">SENS</text>
  <text x="160" y="116" class="brand-sub">TRAIN &amp; WELLNESS</text>
</svg>
